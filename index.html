<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meine Flüge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="map-wrap">

    <!-- Weltkarte (wird von app.js gezeichnet) -->
    <svg id="map"></svg>

    <!-- Zähler oben links -->
    <div class="panel">
      <h1>Meine Flüge</h1>
      <p class="route" id="route"></p>

      <div class="stats">
        <div>
          <span class="value" id="stat-km">0</span>
          <span class="label">Kilometer</span>
        </div>
        <div>
          <span class="value" id="stat-time">0 h 0 min</span>
          <span class="label">in der Luft</span>
        </div>
        <div>
          <span class="value" id="stat-flights">0</span>
          <span class="label">Flüge</span>
        </div>
      </div>

      <div class="buttons">
        <button id="btn-skip">Überspringen</button>
        <button id="btn-replay">Nochmal abspielen</button>
      </div>
    </div>

  </main>

  <!-- Bibliotheken (liegen im Ordner lib, nicht bearbeiten) -->
  <script src="lib/d3.min.js"></script>
  <script src="lib/topojson-client.min.js"></script>

  <!-- Daten -->
  <script src="world.js"></script>
  <script src="airports.js"></script>
  <script src="flights.js"></script>

  <!-- Eigener Code: Karte, Animation, Zähler -->
  <script src="app.js"></script>
</body>
</html>
