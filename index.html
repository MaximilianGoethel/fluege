<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unsere Flüge</title>
  <!-- "?v=6": Versionsnummer, damit der Browser nach Änderungen nicht die alte Datei nimmt -->
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
  <main class="map-wrap">

    <!-- Weltkarte (wird von app.js gezeichnet) -->
    <svg id="map"></svg>

    <!-- Zähler oben links -->
    <div class="panel">
      <h1 id="title">Unsere Flüge</h1>
      <p class="route" id="route"></p>

      <!-- Auswahl: Alle / Maxi / Emanuel / Yaro (wird von app.js aus people.js erzeugt) -->
      <div class="people" id="people"></div>

      <div class="stats">
        <div>
          <span class="value" id="stat-km">0</span>
          <span class="label">Kilometer</span>
        </div>
        <div>
          <span class="value" id="stat-time">0 h 0 min</span>
          <span class="label">in der Luft</span>
        </div>
        <div>
          <span class="value" id="stat-flights">0</span>
          <span class="label">Flüge</span>
        </div>
      </div>

      <!-- Klima-Bilanz (grobe Schätzung) -->
      <div class="stats stats-co2">
        <div>
          <span class="value" id="stat-co2">0 kg</span>
          <span class="label">CO₂-Ausstoß</span>
        </div>
        <div>
          <span class="value tree" id="stat-trees">0</span>
          <span class="label">Bäume zum Ausgleich (1 Jahr)</span>
        </div>
      </div>

      <div class="buttons">
        <button id="btn-skip">Überspringen</button>
        <button id="btn-replay">Nochmal abspielen</button>
        <!-- nur auf euren Geräten sichtbar (siehe admin.js) -->
        <button id="btn-add" hidden>+ Flug</button>
        <button id="btn-list" hidden>Liste</button>
      </div>
    </div>

  </main>

  <!-- Formular für neue Flüge (erscheint nach Klick auf "+ Flug") -->
  <div class="modal" id="add-modal" hidden>
    <form class="modal-card" id="add-form" autocomplete="off">
      <h2 id="f-title">Neuer Flug</h2>

      <label>Wer?
        <select id="f-who"></select>
      </label>

      <label>Datum
        <input type="date" id="f-date" required>
      </label>

      <label>Von
        <input id="f-from" placeholder="z. B. SZX oder Shenzhen" required>
      </label>
      <p class="hint" id="f-from-info"></p>
      <label id="f-from-city-wrap" hidden>Stadtname auf der Website
        <input id="f-from-city">
      </label>

      <label>Nach
        <input id="f-to" placeholder="z. B. CTU oder Chengdu" required>
      </label>
      <p class="hint" id="f-to-info"></p>
      <label id="f-to-city-wrap" hidden>Stadtname auf der Website
        <input id="f-to-city">
      </label>

      <label>Flugzeit (optional, sonst geschätzt)
        <input id="f-duration" placeholder="z. B. 2:30" inputmode="numeric">
      </label>

      <label id="f-token-wrap">GitHub-Schlüssel (nur beim ersten Mal)
        <input type="password" id="f-token" placeholder="github_pat_…">
      </label>

      <p class="status" id="f-status"></p>

      <div class="modal-buttons">
        <button type="submit" id="f-save" class="primary">Speichern</button>
        <button type="button" id="f-cancel" class="secondary">Abbrechen</button>
      </div>
    </form>
  </div>

  <!-- Flugliste zum Bearbeiten und Löschen (erscheint nach Klick auf "Liste") -->
  <div class="modal" id="list-modal" hidden>
    <div class="modal-card list-card">
      <div class="list-head">
        <h2>Flugliste</h2>
        <button type="button" id="list-close" class="secondary">Schließen</button>
      </div>
      <div class="people" id="list-people"></div>
      <ul class="flight-list" id="flight-list"></ul>
      <p class="status" id="list-status"></p>
    </div>
  </div>

  <!-- Bibliotheken (liegen im Ordner lib, nicht bearbeiten) -->
  <script src="lib/d3.min.js"></script>
  <script src="lib/topojson-client.min.js"></script>

  <!-- Daten -->
  <script src="world.js"></script>
  <script>
    // Personen, Flughäfen und Flüge immer frisch laden (nicht aus dem Browser-Speicher),
    // damit neu eingetragene Flüge sofort nach dem Neuladen zu sehen sind
    const fresh = "?t=" + Date.now();
    document.write('<script src="people.js' + fresh + '"><\/script>');
    document.write('<script src="airports.js' + fresh + '"><\/script>');
    document.write('<script src="flights.js' + fresh + '"><\/script>');
  </script>

  <!-- Eigener Code: Karte, Animation, Zähler; Formular für neue Flüge -->
  <script src="app.js?v=6"></script>
  <script src="admin.js?v=6"></script>
</body>
</html>
